<app-auth-shell
  eyebrow="Bon retour"
  heading="Connexion"
  lede="Retrouvez votre bibliothèque et reprenez là où vous vous étiez arrêté."
  [highlights]="highlights"
>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label class="field" for="login-email">
      Adresse email
      <input id="login-email" type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        @if (form.controls.email.errors?.['required']) {
          <span class="field-error">Email requis</span>
        } @else if (form.controls.email.errors?.['email']) {
          <span class="field-error">Format d'email invalide</span>
        }
      }
    </label>

    <label class="field" for="login-password">
      Mot de passe
      <input
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <span class="field-error">Mot de passe requis</span>
      }
    </label>

    <button type="submit" class="btn btn-primary submit" [disabled]="submitting()">
      @if (submitting()) {
        Connexion…
      } @else {
        Se connecter
      }
    </button>
  </form>

  @if (error()) {
    <p class="notice notice-error" role="alert">{{ error() }}</p>
  }

  <p class="switch">
    Pas encore de compte ? <a routerLink="/register">Créer un compte</a>
  </p>
</app-auth-shell>
