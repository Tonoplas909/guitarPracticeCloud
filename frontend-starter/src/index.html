<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Guitar Practice Cloud — Sillon</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Stockez, classez et travaillez vos pistes audio : bibliothèque, lecteur avec visualiseur, boucle A-B et vitesse de lecture."
    />

    <!-- Deux teintes de barre d'adresse, une par thème : le papier le jour,
         l'encre la nuit. -->
    <meta name="theme-color" content="#f3ede1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110d" media="(prefers-color-scheme: dark)" />

    <!-- Favicon maison : un disque et son sillon, en SVG inline pour ne
         dépendre d'aucun fichier dans public/. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23f3ede1'/%3E%3Cg fill='none' stroke='%231b1713' stroke-width='2'%3E%3Ccircle cx='32' cy='32' r='22'/%3E%3Ccircle cx='32' cy='32' r='16' opacity='.45'/%3E%3Ccircle cx='32' cy='32' r='11' opacity='.45'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='6' fill='%23c0391c'/%3E%3Ccircle cx='32' cy='32' r='1.8' fill='%23f3ede1'/%3E%3C/svg%3E"
    />

    <!-- Polices : Fraunces (serif variable) pour la titraille, Inter pour le
         texte courant, JetBrains Mono pour les chronomètres et compteurs.
         Les trois ont une pile de secours déclarée dans styles.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;650;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      /*
       * Le thème choisi est appliqué AVANT le premier rendu. Sans cela, la
       * page s'afficherait une fraction de seconde dans le thème par défaut
       * (papier) avant qu'Angular ne démarre et ne pose « nuit » : un flash
       * blanc désagréable le soir.
       *
       * La même clé de stockage est lue ensuite par ThemeService, qui reste
       * la source de vérité pendant la vie de l'application.
       */
      (function () {
        try {
          var stored = localStorage.getItem('gpc_theme');
          if (stored === 'jour' || stored === 'nuit') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (error) {
          /* Navigation privée ou stockage refusé : on garde « auto ». */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
